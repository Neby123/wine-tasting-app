name: Supabase Keepalive Ping

on:
  schedule:
    # Runs every 3 days at 12:00 UTC to maintain project activity
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Gateway & Database
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase project rprjfaxsmwdzqwzycujh..."
          
          if [ -n "$ANON_KEY" ]; then
            echo "Authenticated mode: Querying sessions table with repository secret..."
            RAW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 15 \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/sessions?select=id&limit=1" || true)
          else
            echo "Unauthenticated gateway mode: Pinging REST API endpoint..."
            RAW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 15 \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/" || true)
          fi
          
          STATUS="${RAW_STATUS:-000}"
          echo "HTTP Response Status Code: $STATUS"
          
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 206 ]; then
            echo "SUCCESS: Authenticated database query completed! Activity timer reset."
          elif [ "$STATUS" -eq 401 ]; then
            echo "SUCCESS: Inbound traffic recorded by Supabase REST gateway (HTTP 401). Set SUPABASE_ANON_KEY secret for authenticated table queries."
          elif [ "$STATUS" -eq 000 ]; then
            echo "ERROR: Failed to establish network connection or resolve host."
            exit 1
          else
            echo "NOTICE: Inbound ping completed with status HTTP $STATUS."
          fi

name: Supabase Keepalive Ping

on:
  schedule:
    # Runs every 3 days at 12:00 UTC to keep the project active
    - cron: '0 12 */3 * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Gateway & Database
        run: |
          echo "Pinging Supabase project rprjfaxsmwdzqwzycujh..."
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          if [ -n "$ANON_KEY" ]; then
            echo "Using configured SUPABASE_ANON_KEY secret..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 15 \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/sessions?select=id&limit=1" || echo "000")
          else
            echo "No custom secret set. Pinging REST gateway endpoint..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 3 --retry-delay 5 --max-time 15 \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/" || echo "000")
          fi
          
          echo "HTTP Response Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "SUCCESS: Supabase project activity recorded! Status: HTTP $STATUS."
          else
            echo "WARNING: Received unexpected status code HTTP $STATUS"
          fi

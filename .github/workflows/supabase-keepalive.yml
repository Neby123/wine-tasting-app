name: Supabase Keepalive Ping

on:
  schedule:
    # Runs periodically to maintain project activity
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Gateway & Database
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase project rprjfaxsmwdzqwzycujh..."
          
          if [ -z "$ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is not configured in repository secrets."
            echo "Supabase database activity keepalive requires an anon API key to query Postgres tables."
            exit 1
          fi

          if ! [[ "$ANON_KEY" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "SECURITY ERROR: SUPABASE_ANON_KEY secret contains invalid characters. Must be a valid JWT token."
            exit 1
          fi

          echo "Authenticated mode: Querying sessions table with repository secret..."
          RAW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 15 \
            -K <(printf 'header = "apikey: %s"\nheader = "Authorization: Bearer %s"\n' "$ANON_KEY" "$ANON_KEY") \
            "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/sessions?select=id&limit=1" || true)
          
          STATUS="${RAW_STATUS:-000}"
          echo "HTTP Response Status Code: $STATUS"
          
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "206" ]; then
            echo "SUCCESS: Authenticated database query completed! Activity timer reset."
          elif [ "$STATUS" = "401" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret was rejected by Supabase (HTTP 401 Unauthorized). Verify repository secret."
            exit 1
          elif [ "$STATUS" = "000" ]; then
            echo "ERROR: Failed to establish network connection or resolve host (Supabase project may be paused in dashboard)."
            exit 1
          else
            echo "NOTICE: Inbound ping completed with status HTTP $STATUS."
          fi


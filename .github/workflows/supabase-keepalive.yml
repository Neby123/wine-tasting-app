name: Supabase Keepalive Ping

on:
  schedule:
    # Runs every 3 days at 12:00 UTC
    - cron: '0 12 */3 * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Database API
        run: |
          echo "Pinging Supabase project rprjfaxsmwdzqwzycujh..."
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          if [ -n "$ANON_KEY" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/sessions?select=id&limit=1" || echo "000")
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://rprjfaxsmwdzqwzycujh.supabase.co/rest/v1/sessions?select=id&limit=1" || echo "000")
          fi
          
          echo "HTTP Response Status Code: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 206 ]; then
            echo "SUCCESS: Valid database query recorded! Activity timer reset."
          elif [ "$STATUS" -eq 000 ]; then
            echo "NOTICE: DNS host unresolvable. Please unpause the project in your Supabase Dashboard at https://supabase.com/dashboard/project/rprjfaxsmwdzqwzycujh"
          else
            echo "Ping sent (HTTP $STATUS). Project activity updated."
          fi
